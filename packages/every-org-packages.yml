description: >-
  First-party distributable code published by Every.org. The finding here is a gap, not an
  inventory: Every.org ships NO client library for its Partner (Charity) API in any language, on
  any registry. npm, PyPI, RubyGems, Packagist, crates.io, NuGet, Maven Central and pkg.go.dev
  carry no Every.org API client. The only first-party distributables are a CDN-delivered embed
  bundle (the open-source Donate Button) and one npm package that is a fork of a third-party
  PayPal component, not an Every.org API SDK. The documentation's own integration examples are
  raw `fetch` and `curl` calls against https://partners.every.org/v0.2.
