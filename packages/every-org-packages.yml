      gate — /0.2/, /0.3/, /0.5/, /1.0/ and even /99.9/button.js all return HTTP 200 sharing one
      identical ETag (a34479b6...), while /0.4/ alone serves a distinct bundle (378746f0...).
      Only 0.4 is a real version line; every other path silently falls through to a catch-all.
