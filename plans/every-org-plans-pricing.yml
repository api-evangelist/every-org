specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Every.org
providerId: every-org
created: '2026-05-04'
generated: '2026-08-28'
method: searched
source: >-
  https://www.every.org/charity-api, https://www.every.org/pricing,
  https://support.every.org/hc/en-us/articles/360061886773-Does-Every-org-charge-fees,
  https://docs.every.org/docs/intro
modified: '2026-08-28'
tags:
  - Charities
  - Donations
  - Fundraising
description: >-
  Every.org's published commercial model for the Partner (Charity) API. Replaces the 2026-05-04
  generated scaffold, which invented a Free / Professional / Enterprise ladder with request quotas
  and overage pricing that Every.org does not publish and does not operate. Every.org is itself a
  501(c)(3) nonprofit; the API is free for non-commercial use with no self-serve paid tier, and
  for-profit/commercial use is a sales conversation. The platform charges nonprofits no platform
  fee on donations — the only cost in the flow is third-party payment processing.
plan_count: 2
pricing_page: https://www.every.org/pricing
api_pricing_page: https://www.every.org/charity-api
self_serve_paid_tier: false
metered_billing: false
plans:
  - id: every-org-free-noncommercial
    name: Free (non-commercial)
    type: free
    price: '0.00'
    currency: USD
    billing_period: none
    description: >-
      Every.org describes the Charity API as free for non-commercial use cases. Access is
      self-serve: create an Every.org account at every.org/charity-api and generate public and
      private keys from the developer dashboard. No credit card, contract, or partner agreement
      is documented as a precondition.
    included_quota: >-
      No monthly request quota is published. The only published ceilings are per-minute,
      per-endpoint, per-key rate limits (100/min nonprofit details, 500/min search, 500/min
      browse) and per-response result caps (search take max 50, browse take max 100).
    overage: none-published
    limits_ref: rate-limits/every-org-rate-limits.yml
    elements:
      - name: Nonprofits API (details, search, browse)
      - name: Fundraisers API (read and create)
      - name: Donate Button and Donate Link embeds
      - name: Nonprofit Donation Webhook
      - name: Partner Webhook
      - name: Staging environment
      - name: Public documentation at docs.every.org
    source: https://www.every.org/charity-api
  - id: every-org-enterprise
    name: For-profit / enterprise
    type: enterprise
    price: contact
    currency: USD
    billing_period: negotiated
    description: >-
      Every.org directs commercial and for-profit users to contact them to explore enterprise
      plans. No price, tier structure, quota, or SLA is published, so nothing is recorded here
      beyond the existence of the sales path.
    included_quota: not-published
    overage: not-published
    contact: partners@every.org
    elements:
      - name: Negotiated commercial terms
      - name: Higher rate limits on request
    source: https://www.every.org/charity-api
platform_fees:
  platform_fee_on_donations: '0'
  detail: >-
    "Every.org does not charge any of our own fees to nonprofits or donors." Every.org takes no
    cut of donations and charges no monthly, annual, or setup fee. The organization is funded by
    philanthropic partners and by an optional, donor-elected tip added at checkout.
  third_party_fees: >-
    Credit-card and other payment-processor fees apply and vary by processor; Every.org publishes
    the disbursement and third-party fee detail at every.org/disbursements. Exact percentages are
    not restated here because they are processor-dependent and Every.org does not publish a single
    fixed number.
  source: https://support.every.org/hc/en-us/articles/360061886773-Does-Every-org-charge-fees
  disbursements_page: https://www.every.org/disbursements
note: >-
  www.every.org served HTTP 429 ("Vercel Security Checkpoint") to every direct crawler probe on
  2026-08-28, so the pricing and charity-api pages were read through indexed search results and
  the provider's own support knowledge base rather than fetched directly. The pages demonstrably
  exist and are publicly indexed; this is an edge bot policy, not a missing page.
maintainers:
